
networks:
  logistics-net:
    driver: bridge

volumes:
  postgres-db-volume:
  zookeeper-data:
  zookeeper-log:
  kafka-data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.13
    container_name: logistics-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - logistics-net

  kafka:
    image: confluentinc/cp-kafka:7.7.13
    container_name: logistics-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - logistics-net

  spark-master:
    image: apache/spark:3.5.9-python3
    container_name: logistics-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/spark/data
      - ./hive:/opt/spark/hive
      - ./src:/opt/spark/src
    networks:
      - logistics-net

  spark-worker:
    image: apache/spark:3.5.9-python3
    container_name: logistics-spark-worker
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 1g
      - --webui-port
      - "8081"
    ports:
      - "8082:8081"
    volumes:
      - ./data:/opt/spark/data
      - ./hive:/opt/spark/hive
      - ./src:/opt/spark/src
    networks:
      - logistics-net

  postgres:
    image: postgres:14-alpine
    container_name: logistics-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - logistics-net

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: logistics-airflow-init
    depends_on:
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --firstname Student \
          --lastname Engineer \
          --role Admin \
          --email admin@indialogistics.internal \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          || airflow users list | grep -q "$${AIRFLOW_ADMIN_USERNAME}"
    networks:
      - logistics-net

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: logistics-airflow-webserver
    depends_on:
      - airflow-init
      - postgres
    restart: always
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      SPARK_MASTER: local[2]
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PROJECT_ROOT: /opt/airflow
      PYTHONPATH: /opt/airflow
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./hive:/opt/airflow/hive
    command: webserver
    networks:
      - logistics-net

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: logistics-airflow-scheduler
    depends_on:
      - airflow-init
      - postgres
    restart: always
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      SPARK_MASTER: local[2]
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PROJECT_ROOT: /opt/airflow
      PYTHONPATH: /opt/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./hive:/opt/airflow/hive
    command: scheduler
    networks:
      - logistics-net
